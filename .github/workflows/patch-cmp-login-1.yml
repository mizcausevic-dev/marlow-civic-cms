name: Patch cms-login compressed chunk 1

on:
  push:
    paths:
      - .github/workflows/patch-cmp-login-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Drop the extra repeated token
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("payload/staging/cmp-login-1")
          data = path.read_bytes()
          old = b"MP5XT+Wyvnr7z8rp/LZXz194TeG4Yfyun8tlfPX3n5XT+Wyvnr7wm8Nww/ldP5bK+evvPyun8tlfPX3hN4bhh/K6fy2V89fefldP5bK+evvCbw3DD+V0/lsr56+8/K6fy2V89feE3huGH8rp/LZXz195+V0/lsr56+8JvDcx"
          new = b"x"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"marker count {count}")
          data = data.replace(old, new, 1)
          digest = hashlib.sha256(data).hexdigest()
          expect = "c75add94dc0ea34edebe5ca08f2b2e0bd79401a25d9fc64ba8cae059d64af990"
          if digest != expect:
              raise SystemExit(f"hash {digest} len {len(data)}")
          path.write_bytes(data)
          print("ok", digest, len(data))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-login-1
          if git diff --cached --quiet; then
            echo "cmp-login-1 already correct"
            exit 0
          fi
          git commit -m "Correct cms-login compressed chunk 1"
          git push origin HEAD:main
