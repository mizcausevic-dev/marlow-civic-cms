name: Patch cmp-editor-15p1
on:
  push:
    paths:
      - .github/workflows/patch-cmp-editor-15p1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the final angle bracket
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          p = Path("payload/staging/cmp-editor-15p1")
          data = p.read_text()
          old = "</body></html"
          new = "</body></html>"
          c = data.count(old)
          if c != 1:
              raise SystemExit(f"marker count {c} len {len(data)}")
          if data.endswith(">"):
              raise SystemExit("already has bracket")
          data = data.replace(old, new, 1)
          h = hashlib.sha256(data.encode()).hexdigest()
          expect = "1fb1dc17ea0455370cc2261a771eaf639517039fcc8745e879347f7a84166c6e"
          if h != expect:
              raise SystemExit(f"hash {h} len {len(data)}")
          p.write_text(data)
          print("ok", h, len(data))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-editor-15p1
          git commit -m "Patch block-editor compressed staging chunk 15 piece 1"
          git push origin HEAD:main
