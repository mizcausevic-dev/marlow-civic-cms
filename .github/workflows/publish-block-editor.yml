name: Publish block-editor.html
on:
  push:
    paths:
      - .github/workflows/publish-block-editor.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand compressed chunks and publish
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path

          def expand(s):
              out = []
              i = 0
              while i < len(s):
                  if s.startswith("\u27e6N\u27e7", i):
                      out.append("\n"); i += 3; continue
                  if s.startswith("\u27e6Q\u27e7", i):
                      out.append('"'); i += 3; continue
                  if s.startswith("\u27e6B\u27e7", i):
                      out.append("\\"); i += 3; continue
                  if s.startswith("\u27e6", i):
                      j = s.find("|", i)
                      k = s.find("\u27e7", j)
                      c = int(s[i+1:j])
                      tok = s[j+1:k]
                      out.append(tok * c)
                      i = k + 1
                  else:
                      out.append(s[i]); i += 1
              return "".join(out)

          parts = []
          for n in range(8):
              parts.append(Path(f"payload/staging/cmp-editor-{n}").read_text())
          for n in range(8, 15):
              for piece in range(4):
                  parts.append(Path(f"payload/staging/cmp-editor-{n}p{piece}").read_text())
          parts.append(Path("payload/staging/cmp-editor-15p0").read_text())
          parts.append(Path("payload/staging/cmp-editor-15p1").read_text())
          blob = "".join(parts)
          if len(blob) != 122701:
              raise SystemExit(f"comp len {len(blob)}")
          text = expand(blob)
          digest = hashlib.sha256(text.encode()).hexdigest()
          expect = "97946d6cfd3c4634a8931cb041d41eec3bc13adfd9006e3cd80174dd4dcaf074"
          if digest != expect:
              raise SystemExit(f"hash {digest} len {len(text.encode())}")
          Path("preview").mkdir(exist_ok=True)
          Path("preview/block-editor.html").write_text(text)
          Path("/tmp/block-editor.html").write_text(text)
          print("ok", digest)
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add preview/block-editor.html
          if git diff --cached --quiet; then
            echo "preview/block-editor.html already correct"
          else
            git commit -m "Add preview/block-editor.html"
            git push origin HEAD:main
          fi
          git fetch origin livepages
          git checkout -B livepages origin/livepages
          cp /tmp/block-editor.html block-editor.html
          git add block-editor.html
          if git diff --cached --quiet; then
            echo "livepages block-editor.html already correct"
          else
            git commit -m "Add block-editor.html"
            git push origin HEAD:livepages
          fi
