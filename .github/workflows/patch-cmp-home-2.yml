name: Patch public-home compressed chunk 2

on:
  push:
    paths:
      - .github/workflows/patch-cmp-home-2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore one character
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("payload/staging/cmp-home-2")
          data = path.read_bytes()
          old = b"06Kn"
          new = b"z6Kn"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"marker count {count}")
          data = data.replace(old, new, 1)
          digest = hashlib.sha256(data).hexdigest()
          expect = "c8b2efd81ddbd60731477119cc49ecfd942b1576c4b95a1feec29991f9ca5021"
          if digest != expect:
              raise SystemExit(f"hash {digest} len {len(data)}")
          path.write_bytes(data)
          print("ok", digest)
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-home-2
          if git diff --cached --quiet; then
            echo "already correct"
            exit 0
          fi
          git commit -m "Correct public-home compressed chunk 2"
          git push origin HEAD:main
