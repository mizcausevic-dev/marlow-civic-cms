name: Patch cmp-editor-8p0
on:
  push:
    paths:
      - .github/workflows/patch-cmp-editor-8p0.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace the one bad character
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          p = Path("payload/staging/cmp-editor-8p0")
          data = p.read_text()
          old = "Qqz0"
          new = "Qqy0"
          c = data.count(old)
          if c != 1:
              raise SystemExit(f"marker count {c}")
          data = data.replace(old, new, 1)
          h = hashlib.sha256(data.encode()).hexdigest()
          expect = "3e91f465c863e87825fb55f45eb6097876e4834a9009052c6a15dd6017c6c93c"
          if h != expect:
              raise SystemExit(f"hash {h}")
          p.write_text(data)
          print("ok", h, len(data))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-editor-8p0
          git commit -m "Patch block-editor compressed staging chunk 8 piece 0"
          git push origin HEAD:main
