name: Patch cmp-editor-12p3
on:
  push:
    paths:
      - .github/workflows/patch-cmp-editor-12p3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the deleted run
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          p = Path("payload/staging/cmp-editor-12p3")
          data = p.read_text()
          old = "FOQLKXPquaHquaKYCylz6rmh6rmimA"
          new = "FOQLKXPquaHquaKYCylz6rmh6rmimAspc+q5oeq5opgLKXPquaHquaKYkWUuPVc0PVc0UwFlLn1XND1XNFMBZS59VzQ9VzRTkCylz6rmh6rmimA"
          c = data.count(old)
          if c != 1:
              raise SystemExit(f"marker count {c}")
          data = data.replace(old, new, 1)
          h = hashlib.sha256(data.encode()).hexdigest()
          expect = "c5e7c3a0183bebb7e4c2bda84b0c9d49b3cb794115a5567393562a1a44347e9c"
          if h != expect:
              raise SystemExit(f"hash {h} len {len(data)}")
          p.write_text(data)
          print("ok", h, len(data))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-editor-12p3
          git commit -m "Patch block-editor compressed staging chunk 12 piece 3"
          git push origin HEAD:main
