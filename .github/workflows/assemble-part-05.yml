name: Assemble payload part-05

on:
  push:
    paths:
      - .github/workflows/assemble-part-05.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Join verified chunks and restore the missing byte
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          chunk = Path("payload/staging/05-2")
          data = chunk.read_bytes()
          old = b"uQ0k94jhEBpcr0xD"
          new = b"uQ0kK94jhEBpcr0xD"
          if data.count(old) != 1:
              raise SystemExit(f"marker count {data.count(old)}")
          data = data.replace(old, new, 1)
          chunk.write_bytes(data)
          out = b"".join(Path(f"payload/staging/05-{i}").read_bytes() for i in range(4))
          digest = hashlib.sha256(out).hexdigest()
          expect = "f014e4dc7d9e91c66b15aafbfa01d1310b5b387f4246dfc4b9dcebef396618b9"
          if digest != expect:
              raise SystemExit(f"hash {digest} len {len(out)}")
          Path("payload/part-05").write_bytes(out)
          print("ok", digest, len(out))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/part-05
          if git diff --cached --quiet; then
            echo "part-05 already correct"
            exit 0
          fi
          git commit -m "Correct CMS payload part-05"
          git push origin HEAD:main
