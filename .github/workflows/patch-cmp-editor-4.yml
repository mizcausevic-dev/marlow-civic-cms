name: Patch block-editor compressed chunk 4

on:
  push:
    paths:
      - .github/workflows/patch-cmp-editor-4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore two characters
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("payload/staging/cmp-editor-4")
          data = path.read_bytes()
          old = b"0ta"
          new = b"0T3ta"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"marker count {count}")
          data = data.replace(old, new, 1)
          digest = hashlib.sha256(data).hexdigest()
          expect = "82f5b37dc48dac36d3da53c17e16edc61bc63c4c853ac56211fd708536135975"
          if digest != expect:
              raise SystemExit(f"hash {digest} len {len(data)}")
          path.write_bytes(data)
          print("ok", digest)
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-editor-4
          if git diff --cached --quiet; then
            echo "already correct"
            exit 0
          fi
          git commit -m "Correct block-editor compressed chunk 4"
          git push origin HEAD:main
