name: Assemble payload part-06

on:
  push:
    paths:
      - .github/workflows/assemble-part-06.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Join verified chunks and drop the extra repeat
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          chunk = Path("payload/staging/06-0")
          data = chunk.read_bytes()
          old = b"TX9Nf01/TX9Nf01/TX9Nf01/TX9Nf01/TX9Nf01/TX9P"
          new = b"TX9Nf01/TX9Nf01/TX9Nf01/TX9Nf01/TX9P"
          if data.count(old) != 1:
              raise SystemExit(f"marker count {data.count(old)}")
          data = data.replace(old, new, 1)
          chunk.write_bytes(data)
          out = b"".join(Path(f"payload/staging/06-{i}").read_bytes() for i in range(4))
          digest = hashlib.sha256(out).hexdigest()
          expect = "427905304c7bffe0f9acd8c1bb9f6bbfc836ad385044826fc0751a1c6f45d1ad"
          if digest != expect:
              raise SystemExit(f"hash {digest} len {len(out)}")
          Path("payload/part-06").write_bytes(out)
          print("ok", digest, len(out))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/part-06
          if git diff --cached --quiet; then
            echo "part-06 already correct"
            exit 0
          fi
          git commit -m "Add CMS payload part-06"
          git push origin HEAD:main
