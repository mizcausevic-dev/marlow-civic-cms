name: Patch block-editor compressed chunk 1

on:
  push:
    paths:
      - .github/workflows/patch-cmp-editor-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace the corrupted tail
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("payload/staging/cmp-editor-1")
          data = path.read_text()
          expect = "c4095b229e3d4154a4ae8787129e5c12ef2cb3125c546e68bb50cb22b81ee17a"
          if hashlib.sha256(data.encode()).hexdigest() == expect:
              print("already correct")
          else:
              a = Path("payload/staging/cmp-editor-1a").read_text()
              b = Path("payload/staging/cmp-editor-1b").read_text()
              if hashlib.sha256(a.encode()).hexdigest() != "4be08ec9329235408d46b9d2d98ea3b118bf741cd666d5c4859aa4bbc4dd2c2d":
                  raise SystemExit("piece a mismatch")
              if hashlib.sha256(b.encode()).hexdigest() != "b85f74b29a71a14095df7d10574ea7957cbf8ccd9c421596af019908ce3bda0a":
                  raise SystemExit("piece b mismatch")
              data = data[:2034] + a + b
              digest = hashlib.sha256(data.encode()).hexdigest()
              if digest != expect:
                  raise SystemExit(f"hash {digest} len {len(data)}")
              path.write_text(data)
              print("ok", digest, len(data))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-editor-1
          if git diff --cached --quiet; then
            echo "already correct"
            exit 0
          fi
          git commit -m "Correct block-editor compressed chunk 1"
          git push origin HEAD:main
