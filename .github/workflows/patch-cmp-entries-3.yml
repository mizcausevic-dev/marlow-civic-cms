name: Patch cms-entries compressed chunk 3

on:
  push:
    paths:
      - .github/workflows/patch-cmp-entries-3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert the missing middle
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("payload/staging/cmp-entries-3")
          data = path.read_text()
          expect = "6d137058f0d26f2e9d591406cc155842841df4700bcb147176b8e84b3390245a"
          if hashlib.sha256(data.encode()).hexdigest() == expect:
              print("already correct")
          else:
              mid = Path("payload/staging/cmp-entries-3-mid").read_text()
              mid_expect = "dd835c32092c775ea403ceed6d0b70e6cb85656a010b0a0be61e06f76b66b50c"
              if hashlib.sha256(mid.encode()).hexdigest() != mid_expect:
                  raise SystemExit("mid hash mismatch")
              data = data[:3059] + mid + data[3059:]
              digest = hashlib.sha256(data.encode()).hexdigest()
              if digest != expect:
                  raise SystemExit(f"hash {digest} len {len(data)}")
              path.write_text(data)
              print("ok", digest, len(data))
          PY
          git config user.name "Miz Causevic"
          git config user.email "causevic.miz@gmail.com"
          git add payload/staging/cmp-entries-3
          if git diff --cached --quiet; then
            echo "already correct"
            exit 0
          fi
          git commit -m "Correct cms-entries compressed chunk 3"
          git push origin HEAD:main
